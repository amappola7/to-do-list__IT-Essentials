<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To - Do List</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="content">
    <header class="header">
      <img class="logo" src="./assets/to - do.png" alt="Decorative Image">
      <nav class="nav-bar">
        <ul class="nav-buttons">
          <li class="nav-button"><a href="">To - Do List</a></li>
          <li class="nav-button"><a href="">Create Task</a></li>
        </ul>
      </nav>
    </header>
    <main class="main-section">
        <article class="tasks-banner">
          <p>TASKS</p>
        </article>
        <article class="task-card">
          <input type="checkbox">
          <h2>Title</h2>
          <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dignissimos maxime earum asperiores consequuntur doloremque ab eum corporis null.</p>
          <span><p>Status: </p></span>
          <span><p>Priority: </p></span>
          <span><p>Start date: </p></span>
          <span><p>Estimated end date: </p></span>
        </article>
    </main>
  </div>
</body>
</html>
